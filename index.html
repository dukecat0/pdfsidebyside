<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Synced Dual PDF Slides</title>
  <link rel="stylesheet" href="./styles.css" />
  <link rel="icon" type="image/svg+xml" href="/icon.svg">
</head>
<body>
  <header class="topbar">
    <div class="topbar__left">
      <h1 class="title">Synced Dual PDF Slides</h1>
      <div class="filepickers">
        <label class="filebtn">
          <input id="fileLeft" type="file" accept="application/pdf" />
          Load Left PDF (ZH)
        </label>
        <label class="filebtn">
          <input id="fileRight" type="file" accept="application/pdf" />
          Load Right PDF (EN)
        </label>
      </div>
    </div>

    <div class="topbar__right">
      <div class="controls">
        <button id="prevBtn" class="btn" disabled>Prev</button>
        <div class="pager" id="pagerSync">
          <span class="pager__label">Page</span>
          <input id="pageInput" class="pager__input" type="number" min="1" value="1" disabled />
          <span class="pager__sep">/</span>
          <span id="pageCount" class="pager__count">—</span>
        </div>

        <div class="pagerGroup" id="pagerDual" hidden>
          <div class="pager">
            <span class="pager__label">L</span>
            <input id="pageLeftInput" class="pager__input" type="number" min="1" value="1" disabled />
            <span class="pager__sep">/</span>
            <span id="pageLeftCount" class="pager__count">—</span>
          </div>
          <div class="pager">
            <span class="pager__label">R</span>
            <input id="pageRightInput" class="pager__input" type="number" min="1" value="1" disabled />
            <span class="pager__sep">/</span>
            <span id="pageRightCount" class="pager__count">—</span>
          </div>
        </div>
        <button id="nextBtn" class="btn" disabled>Next</button>

        <div class="divider"></div>

        <button id="zoomOutBtn" class="btn" disabled>-</button>
        <span id="zoomLabel" class="zoom">100%</span>
        <button id="zoomInBtn" class="btn" disabled>+</button>

        <div class="divider"></div>

        <label class="toggle">
          <input id="syncToggle" type="checkbox" checked />
          <span>Sync</span>
        </label>

        <label class="toggle">
          <input id="fitToggle" type="checkbox" checked />
          <span>Fit to panel</span>
        </label>
      </div>
    </div>
  </header>

  <main class="main">
    <section class="panel">
      <div class="panel__header">
        <div class="panel__title">Left (ZH)</div>
        <div id="leftStatus" class="status">No PDF loaded</div>
      </div>
      <div class="viewer" id="leftViewer">
        <div class="canvasStack" id="leftStack">
          <canvas id="leftCanvasA"></canvas>
          <canvas id="leftCanvasB"></canvas>
          <div class="textLayer" id="leftTextLayer" aria-hidden="true"></div>
        </div>
      </div>
    </section>

    <section class="panel">
      <div class="panel__header">
        <div class="panel__title">Right (EN)</div>
        <div id="rightStatus" class="status">No PDF loaded</div>
      </div>
      <div class="viewer" id="rightViewer">
        <div class="canvasStack" id="rightStack">
          <canvas id="rightCanvasA"></canvas>
          <canvas id="rightCanvasB"></canvas>
          <div class="textLayer" id="rightTextLayer" aria-hidden="true"></div>
        </div>
      </div>
    </section>
  </main>

  <footer class="footer">
    <div class="hint" id="footerHint">
      Load two PDFs to start. Use Arrow keys / mouse wheel to change pages.
    </div>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/pdfjs-dist@2.16.105/build/pdf.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/pdfjs-dist@2.16.105/web/pdf_viewer.min.js"></script>
  <script src="app.js"></script>
</body>
</html>
